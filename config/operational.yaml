# Operational timings. A worker holds a case only for its lease duration; a
# write carrying an expired lease's fencing token is refused.
lease_seconds:
  enrichment: 30
  diagnosis: 90
  review: 90
  execution: 60
  reconciliation: 45
  verification: 45

# The execution lease must be at least twice this value, so a lease cannot
# lapse while a provider call is still outstanding.
provider_http_timeout_seconds: 30

sweeper_batch_size: 100
sweeper_interval_seconds: 15
ttl_expiry_interval_seconds: 60

# Provider adapter. Per-operation timeouts; both must stay at or below
# provider_http_timeout_seconds, so the lease relation above still holds.
provider_base_url: api.razorpay.com
provider_connect_timeout_seconds: 5
provider_create_link_timeout_seconds: 15
provider_fetch_timeout_seconds: 10

# Payment Link validity. Razorpay rejects expire_by less than 15 minutes
# (900s) ahead and more than 6 months ahead.
payment_link_ttl_seconds: 3600

# How often each background job wakes up. A job holds nothing between ticks:
# it claims, works, releases, and sleeps, so an interval is a latency budget
# rather than a lock duration.
case_worker_interval_seconds: 5
executor_interval_seconds: 5
verifier_interval_seconds: 15
review_expiry_interval_seconds: 60
# A closed payment window is not TTL exhaustion, so this sweep is tuned
# separately from ttl_expiry even though both currently run every minute.
action_deadline_expiry_interval_seconds: 60
breaker_monitor_interval_seconds: 10

# Reconciliation loop. max_polls counts provider GETs, not the bounded
# same-key re-POSTs, which are capped separately below.
reconciliation_interval_seconds: 30
reconciliation_max_polls: 20
reconciliation_max_posts_per_attempt: 3

# Ollama diagnosis. Application startup must not require Ollama: when it is
# unreachable the deterministic fallback runs instead.
ollama_host: 127.0.0.1
ollama_port: 11434
ollama_model: gemma3:12b
ollama_timeout_seconds: 20
