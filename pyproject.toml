[project]
name = "reclaim"
version = "0.1.0"
description = "Payment recovery system"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["reclaim*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "provider_contract: hits real Razorpay TEST MODE; skipped without RAZORPAY_KEY_ID",
  "provider_contract_slow: contract test needing a >=15 minute wait; needs RECLAIM_PROVIDER_SLOW=1",
]
